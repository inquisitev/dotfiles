# OS-level packages (need sudo/admin). Dev tools (nvim, lazygit, yazi, gh, node,
# rust, tree-sitter, ripgrep, fzf) live in dot_config/mise/config.toml instead.
# Editing a list here makes chezmoi re-run run_onchange_before_10-packages.
packages:
  darwin:
    brews:
      - git
      - tree
      - fish
      - tmux
      - sqlite
    casks:
      - wezterm
  linux:
    apt:
      - git
      - curl
      - ca-certificates
      - xz-utils
      - unzip
      - file
      - build-essential
      - tree
      - tmux
      - fish
      - sshpass
      - python-is-python3
      - pipx
      - python3-pip
      - uncrustify
      - sqlite3
      - libsqlite3-dev
      - clang
      - clangd
      # X11: forwarding + test apps, clipboard, fonts
      - xauth
      - x11-apps
      - x11-utils
      - x11-xserver-utils
      - xclip
      - xsel
      - fonts-dejavu
      # GUI toolkit runtimes (GTK, Qt, Electron) so typical X apps start.
      # Ubuntu 24.04 renamed some to *t64. apt resolves most old names itself;
      # "a | b" installs the first one this release has (Debian-style alternatives).
      - libgtk-3-0
      - libqt5gui5
      - libxcb-cursor0
      - libxkbcommon-x11-0
      - libnss3
      - libasound2t64 | libasound2
      - libxss1
      - libxtst6
      - libgbm1
      - libgl1
    # Only when xpra = true; installed from xpra.org's signed apt repo.
    xpra:
      - xpra-server
      - xpra-x11
      - xpra-html5
  windows:
    choco:
      - spotify
      - putty
      - brave
      - firefox
      - fzf
      - jq
      - yarn
      - curl
      - ripgrep
      - 7zip.install
      - winscp.install
      - bitwarden-cli
      - azure-cli
      - awscli
      - ruby
      - dart-sdk
      - mingw
      - python3
      - nodejs.install
      - sed
      - lazygit
    scoop:
      - wezterm
  personal:
    windows:
      scoop:
      winget:
        - Blizzard.BattleNet
        - Valve.Steam
        - Nvidia.RTXVoice
        - Discord.Discord
        - Nvidia.GeForceExperience
        - Python.Python.3.11 --scope machine
        - Python.Python.3.13
        - Logitech.GHUB
        - DygmaLabs.Bazecor
        - GitHub.GitHubDesktop
        - Oracle.VirtualBox
        - EpicGames.EpicGamesLauncher
        - Logitech.OptionsPlus
        - Ubisoft.Connect
        - Bambulab.Bambustudio
        - Docker.DockerDesktop
        - GnuWin32.Make
        - 7zip.7zip
        - Neovim.Neovim
        - wez.wezterm
        - Mojang.MinecraftLauncher
        - KeePassXCTeam.KeePassXC
        - sxyazi.yazi
        - Gyan.FFmpeg 
        - 7zip.7zip 
        - jqlang.jq 
        - oschwartz10612.Poppler 
        - sharkdp.fd 
        - BurntSushi.ripgrep.MSVC 
        - junegunn.fzf 
        - ajeetdsouza.zoxide 
        - ImageMagick.ImageMagick
      choco:
        - spotify
        - putty
        - brave
        - firefox
        - fzf
        - jq
        - yarn
        - curl
        - ripgrep
        - 7zip.install
        - winscp.install
        - bitwarden-cli
        - azure-cli
        - awscli
        - ruby
        - dart-sdk
        - mingw
        - python3
        - nodejs.install
        - sed
        - lazygit
